<button
  type="button"
  class="c-tarjeta__boton"
  aria-haspopup="dialog"
  [attr.aria-label]="etiquetaAria()"
  (click)="alPulsar()"
>
  <span class="c-tarjeta__poster">
    @if (pelicula().poster_path) {
      <img
        class="c-tarjeta__imagen"
        [src]="poster()"
        [alt]="'Póster de ' + pelicula().title"
        loading="lazy"
        width="500"
        height="750"
      />
    } @else {
      <span class="c-tarjeta__sin-poster" aria-hidden="true">Sin póster</span>
    }
    <span class="c-nota c-tarjeta__nota" aria-hidden="true">{{ nota() }}</span>
    <span class="c-tarjeta__lupa" aria-hidden="true">
      <svg class="c-tarjeta__lupa-icono" viewBox="0 0 24 24">
        <circle cx="10" cy="10" r="6" />
        <path d="M15 15 L21 21" />
      </svg>
    </span>
  </span>
  <span class="c-tarjeta__cuerpo">
    <span class="c-tarjeta__titulo">{{ pelicula().title }}</span>
    <span class="c-tarjeta__meta">{{ anio() }} · {{ pelicula().vote_count ?? 0 }} votos</span>
  </span>
</button>
